name: Frenchie gui example project build test

on:
  push:
    branches: [ "v1/release" ]
  pull_request:
    branches: [ "v1/release" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        platform_backend: [GLFW, SDL3]
        graphics_backend: [DIRECTX9, OPENGL3, METAL]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: gcc
            cpp_compiler: g++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: windows-latest
            graphics_backend: METAL
          - os: ubuntu-latest
            c_compiler: cl
          - os: ubuntu-latest
            graphics_backend: DIRECTX9
          - os: ubuntu-latest
            graphics_backend: METAL
          - os: macos-latest
            c_compiler: cl
          - os: macos-latest
            graphics_backend: DIRECTX9
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.head_ref }}

    - name: Extract branch name
      shell: bash
      run: echo ${{ github.head_ref }}

    - name: Install DirectX9 on Windows
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        # Install the legacy DXSDK/D3D9 package into a temporary directory
        nuget install Microsoft.DXSDK.D3DX -Version 9.29.952.8 -OutputDirectory ${{ github.workspace }}\nuget_packages
        
        # Locate the underlying include and library path
        $pkgPath = Resolve-Path "${{ github.workspace }}\nuget_packages\Microsoft.DXSDK.D3DX.*" | Select-Object -ExpandProperty Path
        
        # Define specific include and library subfolders
        $includePath = "$pkgPath\build\native\include"
        $libPath = "$pkgPath\build\native\release\lib\x64" # Use \x86 if targeting 32-bit application architectures
        $binPath = "$pkgPath\build\native\release\bin\x64" # Houses runtime DLLs if required
        
        # Set persistent environment variables across future workflow steps
        echo "DXSDK_DIR=$pkgPath" >> $env:GITHUB_ENV
        echo "D3D9_INCLUDE=$includePath" >> $env:GITHUB_ENV
        echo "D3D9_LIB=$libPath" >> $env:GITHUB_ENV
        
        # Append the binary runtime paths directly into the GitHub Runner Windows PATH
        echo "$binPath" >> $env:GITHUB_PATH

    - name: Install dependencies on Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt update
        sudo apt-get install build-essential git make \
        pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
        libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
        libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
        libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
        libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev mesa-utils libxinerama-dev

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/examples/FrenchieGUIExampleProject/build" >> "$GITHUB_OUTPUT" && \
        echo "build-source-dir=${{ github.workspace }}/examples/FrenchieGUIExampleProject/" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DFRENCHIE_PLATFORM_BACKEND=${{ matrix.platform_backend }}
        -DFRENCHIE_GRAPHICS_BACKEND=${{ matrix.graphics_backend }}
        -S ${{ steps.strings.outputs.build-source-dir }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}
